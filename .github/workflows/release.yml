name: Release artifacts

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/vutils
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/vutils.exe
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/vutils
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/vutils
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          cp "${{ matrix.binary }}" dist/stage/vutils
          cp README.md LICENSE-MIT LICENSE-APACHE dist/stage/
          cp "${{ matrix.binary }}" "dist/vutils-${{ matrix.name }}"
          tar -C dist/stage -czf "dist/vutils-${{ matrix.name }}.tar.gz" .
          rm -rf dist/stage
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null
          Copy-Item "${{ matrix.binary }}" dist/stage/vutils.exe
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE dist/stage/
          Copy-Item "${{ matrix.binary }}" dist/vutils-windows-x86_64.exe
          Compress-Archive -Path dist/stage/* -DestinationPath dist/vutils-windows-x86_64.zip
          Remove-Item -Recurse -Force dist/stage
      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-deb@3.7.0 cargo-generate-rpm@0.21.0
      - name: Build DEB and RPM packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          cargo deb --no-build --target "${{ matrix.target }}" --output "dist/vutils_${version}_amd64.deb"
          cargo generate-rpm --target "${{ matrix.target }}"
          cp target/${{ matrix.target }}/generate-rpm/*.rpm dist/
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Create versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "v${version}" ]]; then
              echo "tag ${tag} does not match Cargo version v${version}" >&2
              exit 1
            fi
            title="vutils ${tag#v}"
            notes="Release from ${tag} at commit ${GITHUB_SHA}. Verify downloads with SHA256SUMS."
            release_kind=()
          else
            tag="v${version}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            title="vutils ${version} build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            notes="Automated prerelease from main at commit ${GITHUB_SHA}. Verify downloads with SHA256SUMS."
            release_kind=(--prerelease)
          fi
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "$notes" \
            "${release_kind[@]}"
