[package]
name = "vutils"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Offline, pipeline-friendly developer utilities"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/vutils"
keywords = ["cli", "developer-tools", "offline", "utilities"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
argon2 = "0.5"
arboard = { version = "3.6", default-features = false }
base64 = "0.22"
bcrypt = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.5", features = ["derive", "wrap_help"] }
clap_complete = "4.5"
clap_mangen = "0.2"
csv = "1.3"
cron = "0.15"
data-encoding = "2.9"
flate2 = "1.1"
heck = "0.5"
hmac = "0.12"
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
ipnet = "2.11"
jsonschema = { version = "0.33", default-features = false }
percent-encoding = "2.3"
qrcode = { version = "0.14", default-features = false, features = ["svg", "image"] }
quick-xml = "0.38"
rand = "0.10"
regex = "1.11"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha1 = "0.10"
sha2 = "0.10"
shell-words = "1.1"
similar = "2.7"
sqlformat = "0.5"
sqlparser = "0.62"
tempfile = "3.20"
thiserror = "2.0"
toml = { version = "1.0", features = ["preserve_order"] }
ulid = "1.2"
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1.24", features = ["v1", "v3", "v4", "v5", "v6", "v7", "v8", "fast-rng"] }
walkdir = "2.5"
x509-parser = "0.18"

[dev-dependencies]
proptest = "1.7"
syn = { version = "2.0", features = ["full"] }

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
