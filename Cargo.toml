[package]
name = "vutils"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Offline, pipeline-friendly developer utilities"
authors = ["Volnei Neves <volneinevesfilho@hotmail.com>"]
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/vutils"
homepage = "https://github.com/volneineves/vutils"
repository = "https://github.com/volneineves/vutils"
keywords = ["cli", "developer-tools", "offline", "utilities"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
aes-gcm = "0.11.0"
argon2 = "0.5.3"
arboard = { version = "3.6.1", default-features = false }
base64 = "0.23.1"
bcrypt = "0.19.3"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6.9"
clap_mangen = "0.3.2"
csv = "1.4.0"
cron = "0.17.0"
data-encoding = "2.11.1"
flate2 = "1.1.9"
heck = "0.5"
hmac = "0.13.0"
html-escape = "0.2.15"
image = { version = "0.25.10", default-features = false, features = ["png"] }
ipnet = "2.12.0"
jsonschema = { version = "0.49.8", default-features = false }
percent-encoding = "2.3.2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg", "image"] }
quick-xml = "0.41.0"
rand = "0.10.2"
regex = "1.13.1"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
sha1 = "0.11.0"
sha2 = "0.11.0"
shell-words = "1.1.1"
similar = "3.1.2"
sqlformat = "0.5"
sqlparser = "0.62"
tempfile = "3.27.0"
thiserror = "2.0.20"
toml = { version = "1.1.4", features = ["preserve_order"] }
ulid = "3.0.0"
unicode-normalization = "0.1.25"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v1", "v3", "v4", "v5", "v6", "v7", "v8", "fast-rng"] }
walkdir = "2.5.0"
x509-parser = "0.18.1"
zeroize = "1.9.0"

[dev-dependencies]
proptest = "1.11.0"
syn = { version = "3.0.3", features = ["full"] }

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[package.metadata.deb]
maintainer = "Volnei Neves <volneinevesfilho@hotmail.com>"
section = "utils"
priority = "optional"
assets = [
    ["target/release/vutils", "usr/bin/vutils", "755"],
    ["README.md", "usr/share/doc/vutils/README.md", "644"],
    ["LICENSE-MIT", "usr/share/doc/vutils/LICENSE-MIT", "644"],
    ["LICENSE-APACHE", "usr/share/doc/vutils/LICENSE-APACHE", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/vutils", dest = "/usr/bin/vutils", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/vutils/README.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/doc/vutils/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/doc/vutils/LICENSE-APACHE", mode = "644", doc = true },
]
